name: CI

# PWS-AI-ENGINE-01R2-REVIEW-FIX-02 — verification pipeline on an exact,
# pinned Node 20 patch version.
#
# On the Node version, stated honestly: this repository contains no Dockerfile,
# no application service in `docker-compose.yml`, and no `.nvmrc`, and no
# container runs this Nuxt application — so the deployed Node version is not
# established by any committed configuration or running service. "Node 20" is
# the constraint the project works to, and 20.20.2 is the exact version these
# checks are actually run against, here and locally. It is not a claim about
# production, and the two must be reconciled when the application is first
# deployed.
#
# The version is pinned to a patch rather than the `20` alias because several
# dependencies require `>= 20.19.0`; an older Node 20 fails to satisfy them.
# `npm ci` is deliberate too: it installs strictly from the lockfile, so a
# lockfile that drifts from `package.json` is a build failure rather than a
# silent version change. (That is exactly what the first CI runs caught — a
# lockfile written by npm 11 that npm 10 refused.)
#
# This workflow uses no secrets, calls no AI provider, contacts no Directus
# instance, and deploys nothing. It only runs the same checks a developer runs
# locally.

on:
  push:
    branches:
      - master
      - 'review/**'
      - 'backup/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, lint, build (Node 20.20.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use the exact Node version these checks are verified against
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Unit and integration tests
        run: npx vitest run

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npx nuxt build
