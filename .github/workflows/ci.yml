name: CI

# PWS-AI-ENGINE-01R2-REVIEW-FIX-03 — verification pipeline on the project's
# standard Node version, 22.22.2.
#
# Node 22.22.2 is this project's agreed runtime contract, recorded in `.nvmrc`
# and enforced by `engines` in `package.json`. It is pinned to an exact patch
# rather than the `22` alias so a dependency that quietly requires a newer
# runtime fails here instead of failing later. Nothing is deployed yet, so this
# is a standard the application will be run against — not a claim about a
# running production server.
#
# `nuxt prepare` is not optional and must come before the type-aware steps:
# Nuxt generates `.nuxt/tsconfig.json` and its auto-import declarations, and a
# clean checkout has neither. Its absence is exactly why the first CI runs
# failed at Vitest with every test erroring before it ran.
#
# `npm ci` installs strictly from the lockfile, so a lockfile that drifts from
# `package.json` is a build failure rather than a silent version change.
#
# This workflow uses no secrets, calls no AI provider, contacts no Directus
# instance, and deploys nothing. It runs the same checks a developer runs
# locally.

on:
  push:
    branches:
      - master
      - 'review/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, lint, build (Node 22.22.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use the project's standard Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Generate Nuxt types and auto-imports
        run: npx nuxt prepare

      - name: Unit and integration tests
        run: npx vitest run

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npx nuxt build
