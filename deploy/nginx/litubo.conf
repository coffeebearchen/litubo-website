# LITUBO 生产虚拟主机（草案）
#
# 放置位置（建议）：/etc/nginx/sites-available/litubo.conf
# 启用：ln -s /etc/nginx/sites-available/litubo.conf /etc/nginx/sites-enabled/
# 校验：nginx -t && systemctl reload nginx
#
# TLS：本文件只写 80 端口。证书与跳转由 Cloudflare（Full/Strict）或 certbot 负责，
# 具体方案在部署授权时确定，不在此处假设。

upstream litubo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name litubo.com www.litubo.com;

    # 上传上限：媒体库单文件上限 50 MB，留余量
    client_max_body_size 64m;

    # 安全头（Cloudflare 之外的兜底）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 构建产物：带 hash 的文件长期缓存
    location /_nuxt/ {
        proxy_pass http://litubo_app;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 公开静态资源（public/）
    location /images/ {
        proxy_pass http://litubo_app;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location /icons/ {
        proxy_pass http://litubo_app;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 其余全部交给 Nuxt（SSR + /api）
    location / {
        proxy_pass http://litubo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 流式响应（HTML 与 sitemap 都受益）
        proxy_buffering off;
    }

    # 健康检查：不写 access 日志，避免噪音
    location = /healthz {
        access_log off;
        proxy_pass http://litubo_app/;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/litubo.access.log;
    error_log  /var/log/nginx/litubo.error.log;
}
