name: litubo-cms

# Production base configuration.
# Local development: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Production:        docker compose -f docker-compose.yml up -d

services:
  postgres:
    # FINAL-RELEASE-PRODUCTION-READY-03 — exact version + immutable digest.
    #
    # The floating `16-alpine` tag is rebuilt for every PostgreSQL 16 minor release and every
    # base-image update, so a redeploy could run a different server build than the one the backup /
    # restore tooling, the provisioning artifacts and the capacity baseline were verified against.
    # 16.15 on Alpine 3.24 is the build that was running when this pin was made: the registry resolved
    # `16-alpine`, `16.15-alpine` and `16.15-alpine3.24` to this same digest, so pinning it changed
    # nothing that runs. `node scripts/verify-postgres-pin.mjs` fails on any drift.
    #
    # The digest is the OCI image *index* (multi-architecture) digest, verified against the registry
    # with `docker buildx imagetools inspect`, not a single platform manifest.
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    networks:
      - litubo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    # FINAL-RELEASE-PRODUCTION-READY-01 — exact version + immutable digest.
    #
    # The floating `:11` tag silently follows upstream releases, so a redeploy
    # could move Directus to a version whose system-table shape the tracked
    # permission artifacts were never validated against — and those artifacts
    # fail closed, so the failure would surface as a broken provision, not a
    # warning. The schema snapshot, the guard SQL and both permission artifacts
    # were all verified against 11.17.4.
    #
    # The digest is the OCI image *index* (multi-architecture) digest, verified
    # against the registry with `docker buildx imagetools inspect`, not a single
    # platform manifest: linux/amd64 and linux/arm64 both remain pullable, so
    # pinning does not decide the deployment architecture.
    image: directus/directus:11.17.4@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to loopback only — never 0.0.0.0.
      # Local: access via http://localhost:8055
      # Production: access only via SSH tunnel (ssh -L 8055:localhost:8055 user@server)
      - "127.0.0.1:8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      # SECRET — this project's Directus license key, read by Directus 12 and later. The value lives only in
      # the ignored .env (locally) or the deployment secret manager, never in Git, and reaches the container
      # only through this interpolation. Without it Directus 12 runs on the Core tier, which drops every
      # nuxt-server permission row (docs/project/SECURITY-REMEDIATION-REVIEW.md). Activation binds the key
      # to this project and PUBLIC_URL.
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      WEBSOCKETS_ENABLED: "false"
      PUBLIC_REGISTRATION: "false"
    volumes:
      - ${DIRECTUS_UPLOADS_DIR}:/directus/uploads
      # Read-write: snapshot output lands directly in Git working tree
      - ./directus/schema:/schema
    networks:
      - litubo-internal

  # AI-PDF-SOURCE-01 — document-extractor security-isolation sidecar.
  # Untrusted PDF bytes in, bounded text out. No secrets, no env_file, no
  # volumes, no Directus / Postgres / AI-provider access. It joins only its own
  # internal network, which has no route to the Internet, the host or Directus,
  # and it publishes no port.
  # Host-process Nuxt reaches it through document-extractor-gateway below, at
  # http://127.0.0.1:8787. A future containerized Nuxt would join
  # document-extractor-internal and use http://document-extractor:8787 directly.
  document-extractor:
    build:
      context: ./document-extractor
    image: litubo-document-extractor:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    networks:
      - document-extractor-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AI-PDF-SOURCE-01 — loopback gateway for document-extractor.
  # Docker publishes no port for a container that is only on an internal
  # network, so this container (same image, gateway.mjs) bridges the two: it
  # publishes 127.0.0.1:8787 and pipes each TCP connection, unread, to the one
  # fixed address document-extractor:8787. It parses nothing and stores nothing;
  # the PDF parser itself never gets a route out.
  document-extractor-gateway:
    build:
      context: ./document-extractor
    image: litubo-document-extractor:local
    command: ["node", "gateway.mjs"]
    depends_on:
      document-extractor:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 32
    ports:
      # Bound to loopback only — never 0.0.0.0.
      - "127.0.0.1:8787:8787"
    networks:
      - document-extractor-internal
      - document-extractor-edge
    healthcheck:
      # Passes through the gateway to the extractor, so it checks the whole path.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  litubo-internal:
    driver: bridge
  document-extractor-internal:
    driver: bridge
    internal: true
  # Only the gateway joins this one: it is what lets Docker publish the loopback port.
  document-extractor-edge:
    driver: bridge
